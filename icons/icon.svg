<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2a5c"/>
      <stop offset="55%" stop-color="#241d38"/>
      <stop offset="100%" stop-color="#14121a"/>
    </radialGradient>
    <radialGradient id="grape" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#b98cf0"/>
      <stop offset="45%" stop-color="#8a4fd6"/>
      <stop offset="100%" stop-color="#5a2f96"/>
    </radialGradient>
    <radialGradient id="highlight" cx="32%" cy="26%" r="20%">
      <stop offset="0%" stop-color="#e9d4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e9d4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- vine tendril -->
  <path d="M256 92 C 248 72, 262 56, 250 40" fill="none" stroke="#6fae5a" stroke-width="7" stroke-linecap="round"/>
  <!-- leaf -->
  <path d="M256 108 C 224 92, 216 56, 248 44 C 268 60, 268 96, 256 108 Z" fill="#5f9e52"/>

  <!-- grape cluster -->
  <g>
    <circle cx="256" cy="150" r="38" fill="url(#grape)"/>
    <circle cx="212" cy="196" r="38" fill="url(#grape)"/>
    <circle cx="300" cy="196" r="38" fill="url(#grape)"/>
    <circle cx="184" cy="252" r="38" fill="url(#grape)"/>
    <circle cx="256" cy="252" r="38" fill="url(#grape)"/>
    <circle cx="328" cy="252" r="38" fill="url(#grape)"/>
    <circle cx="212" cy="308" r="38" fill="url(#grape)"/>
    <circle cx="300" cy="308" r="38" fill="url(#grape)"/>
    <circle cx="256" cy="356" r="38" fill="url(#grape)"/>

    <circle cx="256" cy="150" r="38" fill="url(#highlight)"/>
    <circle cx="212" cy="196" r="38" fill="url(#highlight)"/>
    <circle cx="300" cy="196" r="38" fill="url(#highlight)"/>
    <circle cx="184" cy="252" r="38" fill="url(#highlight)"/>
    <circle cx="256" cy="252" r="38" fill="url(#highlight)"/>
    <circle cx="328" cy="252" r="38" fill="url(#highlight)"/>
    <circle cx="212" cy="308" r="38" fill="url(#highlight)"/>
    <circle cx="300" cy="308" r="38" fill="url(#highlight)"/>
    <circle cx="256" cy="356" r="38" fill="url(#highlight)"/>
  </g>
