<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MEMO Hub Collector</title>
<style>
  :root { --accent: #7c3aed; --muted: #8d84a3; --line: #e6e1f2; --text: #2a2438; --bg: #fff; --soft: #f6f4fb; }
  @media (prefers-color-scheme: dark) {
    :root { --muted: #a39cb8; --line: #3a3348; --text: #ece8f5; --bg: #1c1826; --soft: #262033; }
  }
  body { width: 320px; margin: 0; padding: 12px 14px; font: 13px/1.5 "Hiragino Sans", "Noto Sans JP", sans-serif; color: var(--text); background: var(--bg); }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .stats { background: var(--soft); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
  .stats b { color: var(--accent); }
  label { display: block; margin: 6px 0; }
  input[type=text], select { width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  button { flex: 1; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); cursor: pointer; font: inherit; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .muted { color: var(--muted); font-size: 11px; }
  hr { border: none; border-top: 1px solid var(--line); margin: 10px 0; }
  #msg { min-height: 1.2em; }
  [hidden] { display: none !important; }
  h2 { font-size: 13px; margin: 0 0 4px; }
  #trackInput { flex: 1; }
  #trackList { list-style: none; padding: 0; margin: 8px 0 0; max-height: 180px; overflow-y: auto; }
  #trackList li { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  #trackList .t-main { flex: 1; min-width: 0; }
  #trackList .t-name { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #trackList .t-err { color: #dc2626; }
  #trackList button { flex: 0 0 auto; padding: 2px 6px; font-size: 11px; }
  #searchBox { margin-top: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  #searchInfo { margin: 0 0 4px; }
  #searchList { list-style: none; padding: 0; margin: 0; max-height: 220px; overflow-y: auto; }
  #searchList li { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  #searchList li:last-child { border-bottom: none; }
  #searchList img, #searchList .s-noimg { width: 32px; height: 32px; border-radius: 50%; flex: 0 0 32px; object-fit: cover; background: var(--soft); }
  #searchList .s-main { flex: 1; min-width: 0; }
  #searchList .s-name { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #searchList .s-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #searchList button { flex: 0 0 auto; padding: 3px 8px; font-size: 11px; }
</style>
</head>
<body>
  <h1>🍇 MEMO Hub Collector</h1>
  <div class="stats" id="stats">読み込み中…</div>

  <label><input type="checkbox" id="enabledX"> X を閲覧中に自動で集める</label>
  <label>集める範囲
    <select id="mode">
      <option value="all">表示された投稿すべて（タイムライン・検索も）</option>
      <option value="mine">自分の投稿だけ</option>
    </select>
  </label>
  <label>X のユーザー名（@なし・カンマ区切り）<input type="text" id="handleX" placeholder="your_handle"></label>
  <label>自分の755のトークID（URLの 7gogo.jp/〇〇 の部分）<input type="text" id="handle755" placeholder="your_talk"></label>
  <div class="row"><button class="primary" id="save">保存</button></div>

  <hr>
  <h2>7️⃣ 755 追跡リスト</h2>
  <p class="muted">登録したトーク（アカウント）の新着を、Chromeが開いている間3時間おきに自動で取ってきます。初回は新しい方から最大3000件さかのぼります。</p>
  <div class="row">
    <input type="text" id="trackInput" placeholder="トーク名・ユーザー名で検索（IDやURLも可）">
    <button class="primary" id="trackSearch" style="flex:0 0 auto">検索</button>
  </div>
  <div id="searchBox" hidden>
    <p class="muted" id="searchInfo"></p>
    <ul id="searchList"></ul>
    <div class="row" id="searchMoreRow" hidden><button id="searchMore">さらに表示</button></div>
  </div>
  <div class="row" id="trackHereRow" hidden><button id="trackHere">いま開いているトーク（<b id="talkCode"></b>）を追加</button></div>
  <ul id="trackList"></ul>
  <div class="row"><button id="trackRefreshAll">すべて今すぐ更新</button></div>

  <hr>
  <div class="row">
    <button id="openMemo">MEMOを開いて届ける</button>
    <button id="export">JSONで書き出し</button>
  </div>
  <div class="row"><button id="clearSent">送信済みを拡張から消す</button></div>
  <p class="muted" id="msg"></p>
  <p class="muted">集めた投稿はこのブラウザの中だけに保存され、MEMOのページ以外へは送られません。右クリック →「MEMOハブへ送る」で、どのサイトの選択テキストも取り込めます。</p>
  <script src="popup.js"></script>
</body>
</html>
